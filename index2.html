
<!DOCTYPE html>
<html>
<head>
<title>What Should I Eat?</title>
<style>
body{
font-family:Arial;text-align:center;background:#fff3df;padding:30px
}
h1{color:orange#22466}
input,select,button{
padding:12px;margin:7px;border-radius:10px;border:1px solid #ddd 
}
button{background#e67e22;color:white;cursor:pointer}
#result{
background orange;padding:20px;margin:25px auto;
max-width:550px;border-radius:15px
}
</style>
</head>

<body>

<h1>🍴 What Should I Eat?</h1>
<p>Your Smart Food Assistant 🤖</p>

<input id="food" placeholder="Enter ingredients at home">

<select id="mood">
<option>Happy</option>
<option>Sad</option>
<option>Tired</option>
<option>Spicy</option>
<option>Healthy</option>
</select>

<select id="cuisine">
<option>Indian</option>
<option>Continental</option>
<option>Any</option>
</select>

<input id="budget" type="number" placeholder="Budget ₹">

<label>
<input type="checkbox" id="healthy"> 💚 Healthy Mode
</label>

<br>

<button onclick="suggest()">✨ Suggest Food</button>
<button onclick="nearby()">📍 Nearby Restaurants</button>

<div id="result"></div>

<script>
function suggest(){
let f=document.getElementById("food").value.toLowerCase();
let m=document.getElementById("mood").value;
let c=document.getElementById("cuisine").value;
let h=document.getElementById("healthy").checked;
let r="";

if(f.includes("potato")&&f.includes("onion"))
r=c=="Indian"?"🥔 Aloo Pyaz Sabzi":"🥔 Potato Onion Roast";
else if(f.includes("tomato")&&f.includes("bread"))
r="🍅 Tomato Cheese Toast";
else if(f.includes("rice")&&f.includes("vegetable"))
r=c=="Indian"?"🍚 Vegetable Pulao":"🍚 Vegetable Rice Bowl";
else if(f.includes("pasta"))
r="🍝 Vegetable Pasta";
else if(f.includes("paneer"))
r="🧀 Paneer Tikka";
else
r=m=="Spicy"?"🌶️ Spicy Vegetable Stir-Fry":"🥗 Mixed Vegetable Bowl";

if(h)r+="<br>💚 Healthy Mode: Less oil, more vegetables!";
r+="<br>👨‍🍳 AI Tip: Add herbs and spices for extra taste.";

document.getElementById("result").innerHTML="<h2>"+r+"</h2>";
}

function nearby(){
window.open("https://www.google.com/maps/search/restaurants+near+me");
}
</script>

</body>
</html>
